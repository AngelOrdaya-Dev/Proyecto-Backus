<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 320" width="100%" height="100%">
  <defs>
    <!-- Bottle glass gradient -->
    <linearGradient id="goldGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="25%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <!-- Foil neck gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <!-- Label gradient -->
    <linearGradient id="labelGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="bottleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#bottleGlow)">
    <!-- Bottle Silhouette -->
    <!-- Cap -->
    <rect x="71" y="22" width="18" height="12" rx="2" fill="url(#goldFoil)" />
    <!-- Neck -->
    <path d="M72 34 L72 85 Q72 110 50 135 L50 270 Q50 285 65 290 L95 290 Q110 285 110 270 L110 135 Q88 110 88 85 L88 34 Z" fill="url(#goldGlass)" stroke="#fef08a" stroke-width="0.75" />
    <!-- Gold Neck Foil -->
    <path d="M72 34 L72 75 Q72 85 70 92 L90 92 Q88 85 88 75 L88 34 Z" fill="url(#goldFoil)" opacity="0.95" />
    <circle cx="80" cy="55" r="5" fill="#713f12" />
    <text x="80" y="58" font-size="5" fill="#fef08a" font-weight="bold" text-anchor="middle" font-family="sans-serif">C</text>

    <!-- Glass Highlights -->
    <path d="M56 145 L56 265 Q56 275 66 280 L62 280 Q52 275 52 265 L52 145 Q64 125 74 100 L76 100 Q66 125 56 145 Z" fill="#ffffff" opacity="0.22" />

    <!-- Main Front Label -->
    <rect x="54" y="155" width="52" height="78" rx="4" fill="url(#labelGold)" stroke="#d4af37" stroke-width="1.5" />
    <rect x="56" y="157" width="48" height="74" rx="2" fill="none" stroke="#fef08a" stroke-width="0.5" opacity="0.6" />

    <!-- Label Content -->
    <!-- Sun / Inca emblem -->
    <circle cx="80" cy="172" r="7" fill="url(#goldFoil)" />
    <path d="M80 162 L80 182 M70 172 L90 172 M73 165 L87 179 M73 179 L87 165" stroke="#78350f" stroke-width="0.75" opacity="0.7"/>

    <text x="80" y="190" font-size="6.8" font-weight="900" fill="#fef08a" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="0.5">CUSQUEÑA</text>
    <text x="80" y="197" font-size="4.2" font-weight="700" fill="#eab308" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">DORADA</text>

    <!-- Divider line -->
    <line x1="62" y1="202" x2="98" y2="202" stroke="#d4af37" stroke-width="0.75" />

    <text x="80" y="210" font-size="3.5" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">100% PURA MALTA</text>
    <text x="80" y="217" font-size="3.2" font-weight="700" fill="#cbd5e1" text-anchor="middle" font-family="sans-serif">620 ml • 5.0% VOL</text>

    <!-- Base Shadow -->
    <ellipse cx="80" cy="302" rx="35" ry="6" fill="#000000" opacity="0.5" />
  </g>
</svg>
