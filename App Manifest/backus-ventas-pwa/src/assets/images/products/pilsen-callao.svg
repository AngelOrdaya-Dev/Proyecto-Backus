<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pilsenGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="30%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="pilsenLabel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="pilsenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#pilsenGlow)">
    <!-- Cap (Silver/Green) -->
    <rect x="71" y="22" width="18" height="12" rx="2" fill="#047857" stroke="#e2e8f0" stroke-width="0.75" />

    <!-- Bottle Body -->
    <path d="M72 34 L72 85 Q72 110 50 135 L50 270 Q50 285 65 290 L95 290 Q110 285 110 270 L110 135 Q88 110 88 85 L88 34 Z" fill="url(#pilsenGlass)" stroke="#34d399" stroke-width="0.6" />

    <!-- Neck Ring -->
    <rect x="70" y="70" width="20" height="14" rx="2" fill="#b91c1c" />
    <text x="80" y="80" font-size="5" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="sans-serif">1863</text>

    <!-- Glass Reflection -->
    <path d="M56 145 L56 265 Q56 275 66 280 L62 280 Q52 275 52 265 L52 145 Q64 125 74 100 L76 100 Q66 125 56 145 Z" fill="#ffffff" opacity="0.25" />

    <!-- Label -->
    <rect x="54" y="150" width="52" height="82" rx="4" fill="url(#pilsenLabel)" stroke="#047857" stroke-width="2" />
    <!-- Red Top Band -->
    <path d="M54 150 L106 150 L106 162 L54 162 Z" fill="#b91c1c" />
    <text x="80" y="159" font-size="4.8" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="sans-serif" letter-spacing="1">DESDE 1863</text>

    <!-- Pilsen Logo -->
    <text x="80" y="184" font-size="8.5" font-weight="900" fill="#065f46" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="0.5">PILSEN</text>
    <text x="80" y="194" font-size="6" font-weight="800" fill="#b91c1c" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">CALLAO</text>

    <!-- Callao Anchor Crest -->
    <circle cx="80" cy="207" r="6" fill="#059669" />
    <text x="80" y="210" font-size="6" fill="#ffffff" text-anchor="middle">⚓</text>

    <text x="80" y="222" font-size="3.5" font-weight="700" fill="#334155" text-anchor="middle" font-family="sans-serif">LA AUTÉNTICA AMISTAD</text>
    <text x="80" y="228" font-size="3.2" font-weight="700" fill="#64748b" text-anchor="middle" font-family="sans-serif">630 ml • 4.8% VOL</text>

    <!-- Shadow -->
    <ellipse cx="80" cy="302" rx="35" ry="6" fill="#000000" opacity="0.5" />
  </g>
</svg>
