<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 320" width="100%" height="100%">
  <defs>
    <linearGradient id="craftGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="40%" stop-color="#7f1d1d" />
      <stop offset="60%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#280505" />
    </linearGradient>
    <filter id="craftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#craftGlow)">
    <rect x="71" y="26" width="18" height="12" rx="2" fill="#000000" stroke="#ef4444" stroke-width="0.75" />
    <!-- Stubby Craft Bottle -->
