    <path d="M54 140 L54 265 Q54 275 66 280 L62 280 Q50 275 50 265 L50 140 Q62 120 74 95 L76 95 Q64 120 54 140 Z" fill="#ffffff" opacity="0.22" />

    <!-- Dark Rebellious Craft Label -->
    <rect x="52" y="148" width="56" height="82" rx="3" fill="#030712" stroke="#ef4444" stroke-width="1.8" />
    <!-- Red Accent Corner -->
    <polygon points="52,148 70,148 52,166" fill="#ef4444" />

    <!-- Crossed Battle Axes icon -->
    <circle cx="80" cy="170" r="8" fill="#1f2937" stroke="#ef4444" stroke-width="1" />
    <text x="80" y="174" font-size="8" fill="#ef4444" text-anchor="middle">⚔</text>

    <text x="80" y="191" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" letter-spacing="1">BARBARIAN</text>
    <text x="80" y="200" font-size="5" font-weight="800" fill="#ef4444" text-anchor="middle" font-family="sans-serif">RED ALE</text>

    <line x1="58" y1="206" x2="102" y2="206" stroke="#374151" stroke-width="1" />
    <text x="80" y="216" font-size="3.5" font-weight="800" fill="#fca5a5" text-anchor="middle" font-family="sans-serif">CERVEZA ARTESANAL</text>
    <text x="80" y="224" font-size="3.2" font-weight="700" fill="#9ca3af" text-anchor="middle" font-family="sans-serif">330 ml • 6.5% VOL • 45 IBU</text>

