    <circle cx="80" cy="209" r="6" fill="#f59e0b" />
    <text x="80" y="212" font-size="6" fill="#ffffff" text-anchor="middle">🌾</text>

    <text x="80" y="222" font-size="3.5" font-weight="600" fill="#78350f" text-anchor="middle" font-family="sans-serif">TRIGO ANDREWS</text>
    <text x="80" y="228" font-size="3.2" font-weight="700" fill="#92400e" text-anchor="middle" font-family="sans-serif">330 ml • 4.9% VOL</text>

