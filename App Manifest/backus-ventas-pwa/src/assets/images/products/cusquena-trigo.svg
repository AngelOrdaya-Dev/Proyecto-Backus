    <path d="M56 145 L56 265 Q56 275 66 280 L62 280 Q52 275 52 265 L52 145 Q64 125 74 100 L76 100 Q66 125 56 145 Z" fill="#ffffff" opacity="0.22" />

    <rect x="54" y="155" width="52" height="78" rx="4" fill="url(#trigoLabel)" stroke="#ca8a04" stroke-width="1.5" />
    <text x="80" y="172" font-size="5" font-weight="900" fill="#78350f" text-anchor="middle" font-family="sans-serif">TRIGO</text>
    <text x="80" y="190" font-size="6.8" font-weight="900" fill="#78350f" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="0.5">CUSQUEÑA</text>
    <text x="80" y="198" font-size="4.2" font-weight="700" fill="#92400e" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="1">ESPECIALIDAD</text>

